name: Build GL-MT6000 OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libzstd-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Add OpenClash source
        run: |
          set -eux

          rm -rf /tmp/OpenClash
          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          git -C /tmp/OpenClash sparse-checkout set luci-app-openclash

          cp -a \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          git -C /tmp/OpenClash rev-parse HEAD | tee openclash.commit

          test -f package/luci-app-openclash/Makefile

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp configs/mt6000.config .config
          make defconfig

      - name: Verify target and packages
        run: |
          echo "===== Target ====="
          grep -E \
            '^CONFIG_TARGET_mediatek=|^CONFIG_TARGET_mediatek_filogic=|^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt6000=' \
            .config

          echo "===== OpenClash packages ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-ssl|luci-app-openclash|luci-compat|dnsmasq-full|kmod-tun|kmod-nft-tproxy)=' \
            .config || true

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt6000=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_luci-app-openclash=y$' \
            .config

      - name: Download sources
        run: |
          make download -j8 V=s

      - name: Compile firmware
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify firmware
        run: |
          TARGET_DIR="bin/targets/mediatek/filogic"

          SYSUPGRADE_FILE="$(
            find "${TARGET_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*gl-mt6000-squashfs-sysupgrade.bin' \
              -print \
              -quit
          )"

          if [ -z "${SYSUPGRADE_FILE}" ]; then
            echo "::error::GL-MT6000 sysupgrade firmware was not generated"
            exit 1
          fi

          ls -lh "${TARGET_DIR}"
          sha256sum "${SYSUPGRADE_FILE}"

      - name: Upload firmware and metadata
        uses: actions/upload-artifact@v6
        with:
          name: gl-mt6000-openwrt-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            bin/targets/mediatek/filogic/*gl-mt6000*
            bin/targets/mediatek/filogic/sha256sums
            bin/targets/mediatek/filogic/profiles.json
            bin/targets/mediatek/filogic/config.buildinfo
            bin/targets/mediatek/filogic/feeds.buildinfo
            bin/targets/mediatek/filogic/version.buildinfo
            openclash.commit